[package]
name = "nexa-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "avif"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.27"
chrono = "=0.4.45"
caseless = "=0.2.2"
unicode-normalization = "=0.1.25"
alhazen-gpui = { version = "=0.7.1", default-features = false, features = [
    "native",
    "media-foundation",
    "audio-output",
    "native-aac",
    "native-mp3",
] }

[dev-dependencies]
resvg = { version = "=0.45.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }



[profile.dev.package.rav1d]
opt-level = 3

[profile.dev.package.vp9-mt]
opt-level = 3
