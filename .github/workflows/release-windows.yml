name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-main
  cancel-in-progress: false

jobs:
  version:
    name: Check new release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate manifests and check for a new version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs prepare

  release:
    name: Build and publish Windows release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify and fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Build frontend and Windows application
        run: npm run tauri build -- --ci --no-bundle -- --locked
      - name: Package Velopack setup and signed update feed
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-windows.ps1 -SkipBuild
      - name: Tag built commit and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs publish
