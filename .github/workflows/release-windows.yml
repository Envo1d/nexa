name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Validate release versions
        run: node scripts/validate-release.mjs
      - name: Test release and signature tooling
        run: node --test scripts/github-release.test.mjs scripts/verify-update-signature.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore Rust check cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-checks
          save-if: ${{ github.event_name == 'push' }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Validate Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Validate Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - name: Save validated frontend for release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Windows release
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-main
      cancel-in-progress: false
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Check release version and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs check
      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust release cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release
      - name: Install frontend dependencies and packaging CLI
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: release-frontend
          path: dist/
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build application for Velopack
        run: npm run tauri build -- --ci --no-bundle --config .github/tauri-ci.json -- --locked
      - name: Package Velopack setup and signed update feed
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-windows.ps1 -SkipBuild
      - name: Tag built commit and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs publish
