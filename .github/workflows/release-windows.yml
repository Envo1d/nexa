name: Windows build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release-windows.yml"
      - ".github/tauri-ci.json"
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "scripts/**"
      - "package*.json"
      - "*config*"
      - ".prettierrc.json"
      - ".gitattributes"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate release versions
        run: node scripts/validate-release.mjs
      - name: Test update feed signature validation
        run: node --test scripts/verify-update-signature.test.mjs
      - name: Require updater signing key
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Restore Rust dependencies and compiled targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-build
          # Tags can restore main's cache, but cannot share caches with other tags.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Validate Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Validate Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - name: Warm release compilation cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run tauri build -- --ci --no-bundle --config .github/tauri-ci.json -- --locked
      - uses: actions/setup-dotnet@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          dotnet-version: "8.0.x"
      - name: Build application for Velopack
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: npm run tauri build -- --ci --no-bundle --config .github/tauri-ci.json -- --locked
      - name: Package Velopack setup and signed update feed
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-windows.ps1 -SkipBuild
      - name: Create draft release with Velopack assets
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$releaseVersion"
          $outputPath = "src-tauri/target/release/bundle/velopack/$releaseVersion"
          $assets = Get-ChildItem -LiteralPath $outputPath -File |
            Where-Object { $_.Name -match '(-Setup\.exe|-full\.nupkg|^releases\.win-x64\.json(\.sig)?|^RELEASES)$' } |
            ForEach-Object { $_.FullName }
          gh release view $tag --json isDraft --jq .isDraft 1> draft-state.txt 2> $null
          if ($LASTEXITCODE -eq 0) {
            if ((Get-Content draft-state.txt -Raw).Trim() -ne "true") {
              throw "Refusing to overwrite an already published release. Increase the version."
            }
            $legacyAssets = gh release view $tag --json assets --jq '.assets[].name' |
              Where-Object { $_ -eq 'latest.json' -or $_ -match '_x64-setup\.exe(\.sig)?$' }
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect draft release assets" }
            if ($legacyAssets) {
              throw "Draft contains legacy NSIS assets. Remove that obsolete draft or increase the version before releasing Velopack."
            }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --title "Nexa v$releaseVersion" --target $env:GITHUB_SHA --notes "Download Nexa-win-x64-Setup.exe. Existing NSIS users must close Nexa, uninstall the old application and install this setup once; preserve NexaNew settings/database and media folders. Future updates use Velopack packages."
          }
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation/upload failed" }
